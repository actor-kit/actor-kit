name = "actor-kit-auction-example"
compatibility_date = "2024-09-25"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "AUCTION"
class_name = "Auction"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Auction"]

# Outbound event stream (ADR-017 §3). Create the queue once: wrangler queues create auction-events
[[queues.producers]]
binding = "AUCTION_EVENTS"
queue = "auction-events"

[env.preview]
name = "actor-kit-auction-example-preview"
