[[migrations]]
tag = "v19"
new_sqlite_classes = ["Lot", "LotUnbound"]

# Outbound event stream (ADR-017 §3)
[[queues.producers]]
binding = "LOT_EVENTS"
queue = "lot-events"

[[queues.producers]]
binding = "AUCTION_EVENTS"
queue = "auction-events"

[[durable_objects.bindings]]
name = "QUIZ_STATES"
class_name = "QuizStates"

[[migrations]]
tag = "v20"
new_sqlite_classes = ["QuizStates"]

[[durable_objects.bindings]]
name = "LOT_TYPED"
class_name = "LotTyped"

[[migrations]]
tag = "v21"
new_sqlite_classes = ["LotTyped"]

[[durable_objects.bindings]]
name = "NOTICE"
class_name = "Notice"

[[durable_objects.bindings]]
name = "NOTICE_NO_JOURNAL"
class_name = "NoticeNoJournal"

[[durable_objects.bindings]]
name = "READER"
class_name = "Reader"

[[migrations]]
