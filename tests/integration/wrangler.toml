[[durable_objects.bindings]]
name = "LEDGER_NO_JOURNAL"
class_name = "LedgerNoJournal"

[[durable_objects.bindings]]
name = "LEDGER_NO_STUDIO"
class_name = "LedgerNoStudio"

[[migrations]]
tag = "v12"
new_sqlite_classes = ["Ledger", "LedgerNoJournal", "LedgerNoStudio"]

[[durable_objects.bindings]]
