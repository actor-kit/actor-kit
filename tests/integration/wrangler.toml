name = "actor-kit-test"
main = "src/worker.ts"
compatibility_date = "2024-09-25"
compatibility_flags = ["nodejs_compat"]

[vars]
ACTOR_KIT_SECRET = "test-secret-for-integration-tests-only"

[[durable_objects.bindings]]
name = "COUNTER"
class_name = "Counter"

[[durable_objects.bindings]]
name = "TIMER_ACTOR"
class_name = "TimerActor"

[[durable_objects.bindings]]
name = "AUCTION"
class_name = "Auction"

[[durable_objects.bindings]]
name = "COUNTER_V3"
class_name = "CounterV3"

[[durable_objects.bindings]]
name = "FLAT_COUNTER"
class_name = "FlatCounter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Counter", "TimerActor", "Auction"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["CounterV3"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["FlatCounter"]
