name = "actor-kit-test"
main = "src/worker.ts"
compatibility_date = "2024-09-25"
compatibility_flags = []
# Note: Add "enable_ctx_exports" for ctx.exports actor discovery in production.
# Omitted here because vitest-pool-workers/miniflare may not support it yet.

[vars]

[[durable_objects.bindings]]
name = "COUNTER"
class_name = "Counter"

[[durable_objects.bindings]]
name = "NULLABLE_COUNTER"
class_name = "NullableCounter"

[[durable_objects.bindings]]
name = "STUDIO_REGISTRY"
class_name = "StudioRegistry"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Counter"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["NullableCounter"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["StudioRegistry"]
