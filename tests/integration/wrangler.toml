[[migrations]]
tag = "v18"
new_sqlite_classes = ["EnvTyped", "EnvMisbound"]

[[durable_objects.bindings]]
name = "LOT"
class_name = "Lot"

[[durable_objects.bindings]]
name = "LOT_UNBOUND"
