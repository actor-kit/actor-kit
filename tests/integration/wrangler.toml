name = "actor-kit-test"
main = "src/worker.ts"
compatibility_date = "2024-09-25"
compatibility_flags = []
# Note: Add "enable_ctx_exports" for ctx.exports actor discovery in production.
# Omitted here because vitest-pool-workers/miniflare may not support it yet.

[vars]
# Test-only HMAC key for Studio caller hashing (ADR-014). Not a real secret.
STUDIO_CALLER_HASH_KEY = "integration-test-caller-hash-key"

[[durable_objects.bindings]]
name = "COUNTER"
class_name = "Counter"

[[durable_objects.bindings]]
name = "NULLABLE_COUNTER"
class_name = "NullableCounter"

[[durable_objects.bindings]]
name = "CHAT_ROOM"
class_name = "ChatRoom"

[[durable_objects.bindings]]
name = "STUDIO_REGISTRY"
class_name = "StudioRegistry"

[[durable_objects.bindings]]
name = "STUDIO_PROBE"
class_name = "StudioProbe"

[[durable_objects.bindings]]
name = "STUDIO_OFF"
class_name = "StudioOff"

[[durable_objects.bindings]]
name = "STUDIO_REDACTED"
class_name = "StudioRedacted"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Counter"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["NullableCounter"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["StudioRegistry"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["StudioProbe", "StudioOff"]

[[migrations]]
tag = "v5"
new_sqlite_classes = ["ChatRoom"]

[[durable_objects.bindings]]
name = "BULLETIN"
class_name = "Bulletin"

[[durable_objects.bindings]]
name = "DESK"
class_name = "Desk"

[[migrations]]
tag = "v6"
new_sqlite_classes = ["Bulletin", "Desk"]

[[migrations]]
tag = "v7"
new_sqlite_classes = ["StudioRedacted"]

[[durable_objects.bindings]]
name = "JOURNAL_PROBE"
class_name = "JournalProbe"

[[durable_objects.bindings]]
name = "JOURNAL_OFF"
class_name = "JournalOff"

[[durable_objects.bindings]]
name = "JOURNAL_KEEP"
class_name = "JournalKeep"

[[durable_objects.bindings]]
name = "NOT_AN_ACTOR"
class_name = "NotAnActor"

[[migrations]]
tag = "v8"
new_sqlite_classes = ["JournalProbe", "JournalOff", "JournalKeep", "NotAnActor"]

[[durable_objects.bindings]]
name = "EXAMPLE_AUCTION"
class_name = "ExampleAuction"

[[durable_objects.bindings]]
name = "EXAMPLE_CHAT_ROOM"
class_name = "ExampleChatRoom"

[[durable_objects.bindings]]
name = "EXAMPLE_COUNTER"
class_name = "ExampleCounter"

[[durable_objects.bindings]]
name = "EXAMPLE_TODO_LIST"
class_name = "ExampleTodoList"

[[migrations]]
tag = "v9"
new_sqlite_classes = ["ExampleAuction", "ExampleChatRoom", "ExampleCounter", "ExampleTodoList"]

[[durable_objects.bindings]]
name = "RETRIER"
class_name = "Retrier"

[[durable_objects.bindings]]
name = "RETRIER_NO_JOURNAL"
class_name = "RetrierNoJournal"

[[migrations]]
tag = "v10"
new_sqlite_classes = ["Retrier", "RetrierNoJournal"]

[[durable_objects.bindings]]
name = "QUIZ"
