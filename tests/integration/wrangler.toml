new_sqlite_classes = ["Notice", "NoticeNoJournal", "Reader"]

# Service handles, result schemas and delivery modes (ADR-018 G)
[[durable_objects.bindings]]
name = "CASHIER"
class_name = "CashierActor"

[[migrations]]
tag = "v23"
new_sqlite_classes = ["CashierActor"]

# Hierarchical states (ADR-019 A)
[[durable_objects.bindings]]
name = "ROUNDS"
class_name = "RoundsActor"

[[migrations]]
tag = "v24"
new_sqlite_classes = ["RoundsActor"]
