name = "actor-kit-studio-e2e"
main = "worker.ts"
compatibility_date = "2024-09-25"

[[durable_objects.bindings]]
name = "COUNTER"
class_name = "Counter"

[[durable_objects.bindings]]
name = "STUDIO_REGISTRY"
class_name = "StudioRegistry"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Counter", "StudioRegistry"]

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[durable_objects.bindings]]
name = "AUCTION_ROOM"
class_name = "AuctionRoom"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Lobby", "AuctionRoom"]
